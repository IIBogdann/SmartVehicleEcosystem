name: Sarcina de proiect
description: Un bug sau ceva de adaugat
body:
  - type: textarea
    id: objective
    attributes:
      label: Ce avem de facut?
      description: Daca e un bug, scrie ce se intampla si ce te asteptai sa faca.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Mai e ceva de stiut?
      description: Pasi de test, placa necesara sau protocol afectat, daca e cazul. Alege responsabilul la Assignees.
